<div class="dashboard">

  <!-- ==========================================
       TOP BAR
       ========================================== -->

  <div class="top-bar">

    <h1>
      Doctor Dashboard
    </h1>

    <button
      type="button"
      (click)="goToDashboard()">

      Dashboard

    </button>

  </div>


  <!-- ==========================================
       WELCOME
       ========================================== -->

  <p>
    Welcome to the Doctor Dashboard
  </p>


  <p>
    <strong>
      Role:
    </strong>

    DOCTOR
  </p>


  <!-- ==========================================
       MENU
       ========================================== -->

  <div class="menu">


    <!-- DASHBOARD -->

    <button
      type="button"
      (click)="goToDashboard()">

      Dashboard

    </button>


    <!-- PATIENTS -->

    <button
      type="button"
      (click)="goToPatients()">

      View Patients

    </button>


    <!-- APPOINTMENTS -->

    <button
      type="button"
      (click)="goToAppointments()">

      View Appointments

    </button>


    <!-- LOGOUT -->

    <button
      type="button"
      class="logout-button"
      (click)="logout()">

      Logout

    </button>

  </div>

</div>
