<div class="login-container">

  <h2>Patient Management System</h2>

  <h3>Login</h3>

  <form (ngSubmit)="login()">

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter email"
      >

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
      >

    </div>

    <button type="submit">
      Login
    </button>

  </form>

  @if (message) {
    <p class="message">
      {{ message }}
    </p>
  }

  <p class="register-link">
    Don't have an account?

    <a routerLink="/register">
      Register
    </a>
  </p>

</div>
