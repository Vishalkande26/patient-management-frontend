<div class="register-container">

  <h2>Patient Management System</h2>

  <h3>Registration</h3>

  <form (ngSubmit)="register()">

    <div class="form-group">

      <label>Username</label>

      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Enter username"
      >

    </div>

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter email"
      >

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
      >

    </div>

    <button type="submit">
      Register
    </button>

  </form>

  @if (message) {
    <p class="message">
      {{ message }}
    </p>
  }

  <p class="login-link">
    Already have an account?

    <a routerLink="/login">
      Login
    </a>
  </p>

</div>
