<div class="register-page">

  <!-- =========================================
       BACKGROUND GLOW EFFECTS
  ========================================== -->

  <div class="ambient-glow glow-blue"></div>

  <div class="ambient-glow glow-purple"></div>

  <div class="ambient-glow glow-cyan"></div>

  <div class="grid-overlay"></div>


  <!-- =========================================
       MAIN GLASS CARD
  ========================================== -->

  <div class="register-container">


    <!-- Top neon line -->

    <div class="neon-line"></div>


    <!-- =========================================
         BRAND ICON
    ========================================== -->

    <div class="brand-wrapper">

      <div class="brand-icon">

        <div class="brand-ring"></div>

        <svg
          viewBox="0 0 64 64"
          aria-hidden="true"
        >

          <path
            d="M32 8
               C20 8 10 18 10 30
               C10 42 20 52 32 52
               C44 52 54 42 54 30
               C54 18 44 8 32 8Z"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <path
            d="M32 18V42"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M20 30H44"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

        </svg>

      </div>

    </div>


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="register-header">

      <div class="small-label">
        <span class="status-dot"></span>
        PATIENT PORTAL
      </div>

      <h1>
        Create Account
      </h1>

      <p>
        Patient Management
        <span>System</span>
      </p>

      <span class="header-description">
        Create your account to access the secure
        patient management portal.
      </span>

    </div>


    <!-- =========================================
         REGISTRATION FORM
    ========================================== -->

    <form
      (ngSubmit)="register()"
      class="register-form"
    >


      <!-- =====================================
           USERNAME
      ====================================== -->

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <div class="input-wrapper">

          <div class="input-glow"></div>

          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="8"
              r="3.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M4.5 20
                 C4.8 15.8
                 7.3 13.5
                 12 13.5
                 C16.7 13.5
                 19.2 15.8
                 19.5 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

          </svg>


          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />

        </div>

      </div>


      <!-- =====================================
           EMAIL
      ====================================== -->

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrapper">

          <div class="input-glow"></div>

          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M4 5h16
                 c1.1 0 2 .9 2 2v10
                 c0 1.1-.9 2-2 2H4
                 c-1.1 0-2-.9-2-2V7
                 c0-1.1.9-2 2-2Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m4 7 8 6 8-6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>


          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>

      </div>


      <!-- =====================================
           PASSWORD
      ====================================== -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <div class="input-glow"></div>

          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="5"
              y="10"
              width="14"
              height="10"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M8 10V7
                 a4 4 0 0 1 8 0v3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="15"
              r="1.2"
              fill="currentColor"
            />

          </svg>


          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            autocomplete="new-password"
            required
          />


          <!-- Password visibility -->

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="
              showPassword
                ? 'Hide password'
                : 'Show password'
            "
          >

            @if (showPassword) {

              <!-- Eye Off -->

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M3 3l18 18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

                <path
                  d="M10.6 10.6
                     A2 2 0 0 0 13.4 13.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

                <path
                  d="M9.9 5.1
                     C10.6 4.9 11.3 4.8 12 4.8
                     C17 4.8 20.5 9.1 21.5 12
                     C21 13.5 20 15.1 18.5 16.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  d="M6.2 6.2
                     C4.5 7.5 3.2 9.6 2.5 12
                     C3.5 15
                     7.1 19.2 12 19.2
                     C13.2 19.2 14.4 19
                     15.5 18.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

              </svg>

            } @else {

              <!-- Eye -->

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M2.5 12
                     C4 7.8 7.5 5 12 5
                     C16.5 5 20 7.8 21.5 12
                     C20 16.2 16.5 19 12 19
                     C7.5 19 4 16.2 2.5 12Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

              </svg>

            }

          </button>

        </div>

      </div>


      <!-- =====================================
           REGISTER BUTTON
      ====================================== -->

      <button
        type="submit"
        class="register-button"
      >

        <span class="button-content">

          <span>
            Create Account
          </span>

          <svg
            class="button-arrow"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M5 12h13"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="m13 6 6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </span>

      </button>

    </form>


    <!-- =========================================
         MESSAGE
    ========================================== -->

    @if (message) {

      <div
        class="message"
        [class.success]="message.includes('successful')"
        [class.error]="!message.includes('successful')"
      >

        <span class="message-icon">

          @if (message.includes('successful')) {
            ✓
          } @else {
            !
          }

        </span>

        <span>
          {{ message }}
        </span>

      </div>

    }


    <!-- =========================================
         LOGIN LINK
    ========================================== -->

    <div class="login-section">

      <span>
        Already have an account?
      </span>

      <a routerLink="/login">
        Login
        <span class="login-arrow">→</span>
      </a>

    </div>


    <!-- =========================================
         SECURITY FOOTER
    ========================================== -->

    <div class="register-footer">

      <div class="security-item">

        <span class="footer-icon">✓</span>

        Secure

      </div>

      <span class="footer-separator"></span>

      <div class="security-item">

        <span class="footer-icon">●</span>

        Protected

      </div>

      <span class="footer-separator"></span>

      <div class="security-item">

        <span class="footer-icon">◆</span>

        Private

      </div>

    </div>

  </div>

</div>
